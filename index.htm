<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catálogo online de Relojes León. Modelos deportivos, clásicos y premium. Consultá disponibilidad por WhatsApp."
    />

    <title>Catálogo de Relojes Leon</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Catálogo de Relojes Leon" />
    <meta
      property="og:description"
      content="Elegí tu reloj y consultá por WhatsApp. Stock limitado."
    />
    <meta
      property="og:image"
      content="https://catalogo-relojes-leon.netlify.app/img/preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:url"
      content="https://catalogo-relojes-leon.netlify.app/"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter (WhatsApp fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://catalogo-relojes-leon.netlify.app/img/preview.jpg"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-25W5QNCBTX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-25W5QNCBTX");
    </script>
  </head>

  <body>
    <main class="catalog">
      <!-- HERO -->
      <section class="hero">
        <h1>Showroom Online</h1>
        <p>Relojes calidad AAA · Stock limitado · Coordinación por WhatsApp</p>
        <a href="#mas-vendidos" class="btn-hero">Ver modelos destacados</a>
      </section>

      <!-- FILTROS -->
      <section class="filtros" aria-label="Filtrar por categoría">
        <button data-filter="all" class="activo">Todos</button>
        <button data-filter="deportivo">Deportivos</button>
        <button data-filter="clasico">Clásicos</button>
        <button data-filter="retro">Retro</button>
        <button data-filter="premium">Premium</button>
      </section>

      <!-- DESTACADOS (queda manual por ahora) -->
      <section class="destacados">
        <h2>⭐ Destacados</h2>
        <div class="destacados-scroll">
          <!-- Dejamos tus destacados como están -->
        </div>
      </section>

      <!-- MÁS VENDIDOS -->
      <section class="mas-vendidos" id="mas-vendidos">
        <h2>🔥 Más vendidos</h2>
        <div class="grid" id="productosGrid"></div>

        <button id="verMasBtn" class="btn-ver-mas" data-state="collapsed">
          Ver más modelos ↓
        </button>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="catalog-footer">
      <hr class="footer-line" />

      <button type="button" class="btn-whatsapp-share" id="shareCatalogo">
        📲 Compartir catálogo en WhatsApp
      </button>

      <p class="footer-credit">
        Catálogo diseñado y desarrollado por <strong>BuenoStudio</strong>
      </p>

      <hr class="footer-line" />
    </footer>
    <script src="filtros.js"></script>
  </body>
</html>
